<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Gracefully handle benign Vite HMR notices and Firestore offline fallback in container sandbox
      (function() {
        function shouldSuppress(item) {
          if (!item) return false;
          var str = '';
          if (typeof item === 'string') {
            str = item;
          } else if (item.message && typeof item.message === 'string') {
            str = item.message;
          } else {
            try { str = String(item); } catch(e) { return false; }
          }
          var lower = str.toLowerCase();
          return lower.indexOf('[vite]') !== -1 ||
                 lower.indexOf('vite-error-overlay') !== -1 ||
                 lower.indexOf('@firebase/firestore') !== -1 ||
                 lower.indexOf('could not reach cloud firestore') !== -1 ||
                 lower.indexOf('the client will operate in offline mode') !== -1 ||
                 lower.indexOf('[code=unavailable]') !== -1;
        }

        var _err = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (shouldSuppress(arguments[i])) {
              return;
            }
          }
          _err.apply(console, arguments);
        };

        var _warn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (shouldSuppress(arguments[i])) {
              return;
            }
          }
          _warn.apply(console, arguments);
        };

        // Suppress benign unhandledrejection events containing [vite] or Firestore offline status
        window.addEventListener('unhandledrejection', function(event) {
          if (shouldSuppress(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });

        window.addEventListener('error', function(event) {
          if (shouldSuppress(event.error) || shouldSuppress(event.message)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        });
      })();
    </script>
    <style>
      vite-error-overlay { display: none !important; }
    </style>
