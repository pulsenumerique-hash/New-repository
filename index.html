<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Gracefully handle benign Vite HMR notices and Firestore offline fallback in container sandbox
      (function() {
        // Safe WebSocket wrapper: silently handle Vite HMR connection attempts in container sandbox only
        if (
          typeof window !== 'undefined' &&
          window.WebSocket &&
          (window.location.hostname === 'localhost' ||
            window.location.hostname.includes('run.app') ||
            window.location.port === '3000')
        ) {
          var OriginalWS = window.WebSocket;
          var MockHmrWS = function(url, protocols) {
            var urlStr = String(url || '');
            var isViteHmr = urlStr.indexOf('24678') !== -1 ||
                            protocols === 'vite-hmr' ||
                            (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1);
            if (isViteHmr) {
              var self = {
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                readyState: 1, // OPEN
                url: urlStr,
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null,
                close: function() {},
                send: function() {},
                addEventListener: function(event, cb) {
                  if (event === 'open' && typeof cb === 'function') {
                    setTimeout(function() { cb({ type: 'open' }); }, 10);
                  }
                },
                removeEventListener: function() {},
                dispatchEvent: function() { return true; }
              };
              setTimeout(function() {
                if (typeof self.onopen === 'function') {
                  self.onopen({ type: 'open' });
                }
              }, 10);
              return self;
            }
            return new OriginalWS(url, protocols);
          };
          MockHmrWS.prototype = OriginalWS.prototype;
          MockHmrWS.CONNECTING = OriginalWS.CONNECTING;
          MockHmrWS.OPEN = OriginalWS.OPEN;
          MockHmrWS.CLOSING = OriginalWS.CLOSING;
          MockHmrWS.CLOSED = OriginalWS.CLOSED;
          window.WebSocket = MockHmrWS;
        }

        function shouldSuppress(item) {
          if (!item) return false;
          var str = '';
          if (typeof item === 'string') {
            str = item;
          } else if (item.message && typeof item.message === 'string') {
            str = item.message;
          } else if (item.target && item.target.url && typeof item.target.url === 'string') {
            str = item.target.url;
          } else {
            try { str = String(item); } catch(e) { return false; }
          }
          var lower = str.toLowerCase();
          return lower.indexOf('[vite]') !== -1 ||
                 lower.indexOf('vite-error-overlay') !== -1 ||
                 lower.indexOf('@firebase/firestore') !== -1 ||
                 lower.indexOf('could not reach cloud firestore') !== -1 ||
                 lower.indexOf('the client will operate in offline mode') !== -1 ||
                 lower.indexOf('[code=unavailable]') !== -1 ||
                 (lower.indexOf('websocket') !== -1 && lower.indexOf('vite') !== -1);
        }

        var _err = console.error;
        console.error = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (shouldSuppress(arguments[i])) {
              return;
            }
          }
          _err.apply(console, arguments);
        };

        var _warn = console.warn;
        console.warn = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (shouldSuppress(arguments[i])) {
              return;
            }
          }
          _warn.apply(console, arguments);
        };

        var _info = console.info;
        console.info = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (shouldSuppress(arguments[i])) {
              return;
            }
          }
          _info.apply(console, arguments);
        };

        var _debug = console.debug;
        console.debug = function() {
          for (var i = 0; i < arguments.length; i++) {
            if (shouldSuppress(arguments[i])) {
              return;
            }
          }
          _debug.apply(console, arguments);
        };

        // Suppress benign unhandledrejection events containing [vite] or Firestore offline status
        window.addEventListener('unhandledrejection', function(event) {
          if (shouldSuppress(event.reason) || (event.reason && event.reason.type === 'error')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (shouldSuppress(event.error) || shouldSuppress(event.message) || (event.filename && event.filename.indexOf('@vite') !== -1)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <style>
      vite-error-overlay { display: none !important; }
    </style>

  </head>
